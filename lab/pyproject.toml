[project]
name = "nextstroke-lab"
version = "0.0.0"
description = "Disposable Phase 0 evaluation lab for NextStroke (not production code)."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "pydantic>=2.9",
]

[project.scripts]
nextstroke-lab = "nextstroke_lab.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nextstroke_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4", "PL", "TID"]
ignore = ["PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PIL".msg = "Domain code must stay pure; use adapters for image I/O."

[tool.ruff.lint.per-file-ignores]
"src/nextstroke_lab/adapters/**" = ["TID251"]
"tests/**" = ["TID251", "PLR0913"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=nextstroke_lab --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=95"
