name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: ./scripts/setup.sh
      - run: ./scripts/check.sh
      - name: Browser tests (Playwright, Chromium)
        run: |
          pnpm --filter @nextstroke/web exec playwright install --with-deps chromium
          pnpm run e2e
