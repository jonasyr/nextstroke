name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: ./scripts/setup.sh
      - run: ./scripts/check.sh
      # scripts/setup.sh above installed Chromium and WebKit with their system libraries.
      - name: Browser tests (Playwright, Chromium and WebKit)
        env:
          PW_WEBKIT: "1"
        run: pnpm run e2e
